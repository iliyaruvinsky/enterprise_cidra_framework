# -----------------------------------------------------------------------------
# VERSION HISTORY
# -----------------------------------------------------------------------------
version_history:

  - version: "1.0.0"
    date: "2026-05-30"
    changes:
      - "Initial protocol authored after RK1_PHARMACY_JOURNAL audit"
      - "7 core principles (MRP_001 — MRP_007)"
      - "Direction policy for 6 content kinds"
      - "10 forbidden patterns (FP_001 — FP_010)"
      - "10 validation checks (MRP_VC_001 — MRP_VC_010)"
      - "Companion viewer at Protocols/viewer/viewer.html"
    motivation: |
      RK1_PHARMACY_JOURNAL documentation audit revealed inconsistent
      handling of Hebrew + English mixed content across documenter
      outputs. Identifiers landed on the wrong side of Hebrew
      punctuation; table cells with code reversed column order under
      RTL; em-dash separators in bilingual headings rendered
      ambiguously. The protocol unifies handling so every CIDRA
      bilingual artifact renders identically across viewers.

  - version: "1.2.0"
    date: "2026-06-01"
    changes:
      - "table_conventions.table_visual_style: new subsection mandating GitHub-grade visual contrast (dark slate-700 header on slate-50/white zebra body, slate-400/300 frame/cell borders, 8x14 padding) with explicit light- and dark-theme palettes"
      - "Validation rules TABLE_VIS_001 — TABLE_VIS_010 covering CSS variable declaration parity, var()-free DOCX inline styles, pre-baked zebra, header fill, merged-cell neutralization, no table-level border, no @supports in DOCX, no dark-theme leakage"
      - "Forbidden inline styles on tables extended: var(), calc(), gradients, transform, box-shadow, flex/grid, padding-inline/-block (Word drops), border-radius (Word Mobile bug), unitless line-height (html-docx-js exact-twips bug)"
      - "DOCX theme contract: light theme is ALWAYS baked into DOCX exports regardless of viewer state (Word lacks theme awareness; recipients typically print/share)"
      - "Dark-theme --tbl-code-bg lifted from #1f2937 to #374151 to defeat the contrast collapse against --tbl-row-even #161b22 surfaced in adversarial review"
      - "Mandatory CSS properties split into viewer (logical) and DOCX-inline (resolved literal) lists — Word ignores padding-inline and text-align:start, so logical properties are forbidden in DOCX inline styles"
    motivation: |
      Tables produced by the viewer up through v1.1.0 were technically
      correct (direction, zebra-via-nth-child, code-only override) but
      visually flat — header rows blended into body rows, borders were
      light-gray and easy to miss, and DOCX exports lost even that
      because html-docx-js drops CSS Custom Properties. Adversarial
      review across three lenses (table-edge-cases, docx-rendering-
      quirks, rtl-and-theme-interactions) surfaced critical/high gaps:
      DOCX theme leakage when var() resolved against stale dark
      values; em-based font sizing dropped by Word; padding-inline
      ignored; merged-cell zebra bands; nested-table double-painting;
      dark-theme contrast collapse on inline code chips. v1.2.0 folds
      all critical+high findings into the protocol AND into the viewer.

  - version: "1.1.0"
    date: "2026-05-31"
    changes:
      - "MRP_VC_001 regex rewritten with Unicode escapes (\\u202A-\\u202E) so the protocol file passes its own check and does not corrupt LLM tokenization"
      - "Added direction_policy.numbers.ranges_and_compound_numbers — single-atom backtick + en-dash for line ranges (FP_007 + MRP_VC_009)"
      - "Heading conventions: deprecated em-dash form (FP_008), promoted colon-with-bdi and two-headings forms; bare slash/pipe still forbidden (FP_009)"
      - "Hebrew comment in code: documented LTR-pre trade-off explicitly; renderer post-processes hljs-comment spans containing Hebrew into <bdi dir=rtl>; viewer offers Mirror Hebrew comments toggle as view-time preference"
      - "FP_004 demoted from forbidden to preferred; MRP_VC_005 scoped to prose only (excludes code blocks and backtick spans) to prevent false positives on source-quoted ש\"ח"
      - "MRP_VC_002 rewritten as two-pass ripgrep-compatible algorithm with framework_id_allowlist and acronym_allowlist (SAP, URL, JSON, API, etc.) to eliminate false positives"
      - "MRP_VC_008 defined inline (no delegation to non-existent DOC_INT_005_extended); per-language phrase lists explicit"
      - "All penalty values are parseable integers (points_per_occurrence + max_penalty + is_blocker)"
      - "Added FP_011 / MRP_VC_011 for escaped Unicode Hebrew (\\u05XX from PowerShell ConvertTo-Json)"
      - "Added encoding section with PowerShell utf8NoBOM guidance and ConvertTo-Json round-trip warning"
      - "Added mermaid_diagrams section with htmlLabels:true requirement and MRP_VC_012"
      - "Added list_conventions.nested_lists rule including <ul>/<ol> in unicode-bidi:plaintext re-declaration"
      - "table_conventions: explicit code_only detection algorithm; nested_tables inheritance rule"
      - "css_pattern_library: full reference patterns matching viewer.html implementation; permanent anti-pattern guard comment retained"
      - "direction:ltr on <pre> NO LONGER marked !important — allows hjls-comment-level Hebrew override (MRP_001)"
      - "Mono font stack: Hebrew fallbacks appended (Miriam Mono CLM, Hack Hebrew, Noto Sans Mono Hebrew)"
      - "Added front-matter convention (dir: rtl|ltr|auto) — parsed by viewer to set html[dir] before render"
    motivation: |
      Adversarial review (typography-correctness, implementation-
      feasibility, edge-cases lenses) against the v1.0 draft identified
      critical defects that would have shipped to production: regex
      self-sabotage (MRP_VC_001 embedding the forbidden codepoints in
      its own definition), unparseable penalty strings ("2_per_occurrence"
      as a YAML scalar), reference to non-existent DOC_INT_005_extended,
      MRP_VC_002 false-positives on framework rule IDs and common
      acronyms, em-dash heading separator that visually anchors to the
      English run rather than the boundary, line range visual reversal,
      Hebrew comment anchoring trade-off undocumented. v1.1.0 folds all
      critical+high adversarial findings into the published protocol.
