        - "AS/400 7 files per program → C/C++ 7 files per component"

  reference_examples:
    when_available:
      gold_standard: "First completed C/C++ component (becomes reference)"
      simple_example: "Single-file C program with minimal headers"
      complex_example: "Multi-file C++ component with classes, templates, multiple headers"

    structure_to_follow:
      - "Same as AS/400: careful language throughout"
      - "Same as AS/400: exact counting only"
      - "Same as AS/400: cross-reference validation"
      - "Same as AS/400: mandatory limitations section"
      - "Same as AS/400: 7 files per component"

# ============================================================================
# LESSONS FROM MACCABI PROJECT (carried over)
# ============================================================================

lessons_learned:

  critical_discoveries:
    - lesson: "Cross-reference check is ESSENTIAL"
      detail: |
        In MACCABI: Component Controller check was initially missed.
        For AS/400: Copy member check was equivalent.
        For C/C++: Header file check is equivalent - struct / class / prototype
        defined in a header is SHARED across translation units.

    - lesson: "Count field-by-field, not structure-by-structure"
      detail: |
        MACCABI: Counted Context Nodes but missed field counts initially.
        C/C++: Must count struct/class members individually, not just type count.

    - lesson: "Conditional compilation can hide whole subsystems"
      detail: |
        MACCABI: V_DETAIL had 140+ event handlers, initially missed.
        C/C++: #ifdef branches can hide platform-specific code paths -
        document which branches were analyzed and which were not.

    - lesson: "Careful language prevents hallucinations"
      detail: |
        MACCABI: "appears to" instead of "does" prevented overconfidence.
        C/C++: Same principle - never claim certainty without verification.

    - lesson: "Limitations section shows honesty"
      detail: |
        MACCABI: Stating what's unknown (Types, backend logic) built trust.
        C/C++: State what's unknown (macro expansions, external libs,
        unanalyzed #ifdef branches) equally important.

  anti_hallucination_keys:
    - "Read ALL source / header files before claiming relevance"
    - "Count exactly using commands, never estimate"
    - "Check cross-references (headers) always"
    - "Use careful language consistently"
    - "Include limitations section in every document"
    - "Verify after every claim"
    - "Mark shared (in header) vs local (static / file-scope) explicitly"

# ============================================================================
# USAGE WORKFLOW
# ============================================================================

workflow:

  phase_1_analyze:
    duration: "5 minutes"
    steps:
      - "Scan all .c / .cpp / .h / .hpp files in project tree"
      - "Identify component name references (function / class / type)"
      - "Find main source + included headers + related sources"
      - "List relevant files (typical: 3-15 out of 50-500)"

    output: "List of relevant source / header files to document"

  phase_2_count:
    duration: "5 minutes"
    steps:
      - "Count total lines exactly (PowerShell: (Get-Content).Count)"
      - "Count preprocessor directives (includes / defines / ifdefs) exactly"
      - "Count types (structs / unions / enums / classes) exactly"
      - "Count struct / class fields field-by-field"
      - "Count function definitions exactly (verify heuristic manually)"
      - "Count modifiers (static / inline / constexpr / extern \"C\")"

    output: "Exact counts for all elements"

  phase_3_cross_reference:
    duration: "5 minutes"
    steps:
      - "Extract all #include directives (system + user)"
      - "Read each user header"
      - "Check each type / prototype against headers"
      - "Mark as shared (with header source) or local"
      - "Check external symbol references against included headers"

    output: "Shared vs local marking for all declarations"

  phase_4_document:
    duration: "15 minutes"
    steps:
      - "Create 7 documentation files from templates"
      - "Use careful language throughout"
      - "Include exact counts (no estimates)"
      - "Mark shared / local declarations explicitly"
      - "Add limitations section (note unanalyzed #ifdef branches)"
      - "Reference specific line numbers"

    output: "7 documentation files completed"

  phase_5_validate:
    duration: "5 minutes"
    steps:
      - "Run automated quality checks"
      - "Verify forbidden words = 0"
      - "Verify careful language present"
      - "Verify limitations section exists"
      - "Verify cross-references marked"
      - "Verify exact counts match code"
      - "Calculate quality score"

    output: "Quality score (target: 100/100)"

  total_time: "~35 minutes per component (same as MACCABI per screen)"

